# Lumora lead engine - all tunable settings live here.
# Change values, save, run again. No need to touch the code.

sectors:
  - nursery          # biomedical science comes later

postcodes:
  api_base: https://api.postcodes.io
  request_timeout_seconds: 20

# ---- Phase 1: client leads ----

providers:
  # Ofsted provider-level data file (CSV). The loader will use this path.
  source_file: data/ofsted_providers.csv
  min_places: 20                 # a 6-place childminder will not pay an agency fee
  exclude_provider_types:
    - Childminder

vacancies:
  adzuna_country: gb
  max_days_old: 7
  results_per_page: 50
  england_only: true          # Ofsted / this market is England; drop Scotland, Wales, NI
  nursery_keywords:
    - nursery practitioner
    - nursery nurse
    - early years practitioner
    - room leader nursery
    - nursery manager
    - level 3 early years

matching:
  fuzzy_threshold: 88            # rapidfuzz score out of 100
  strip_words:                   # removed before comparing employer names
    - ltd
    - limited
    - day nursery
    - nursery
    - pre-school
    - preschool
    - childcare
    - nurseries
    - the
    - and

# Competitor agencies / job boards / training providers.
# Their postings are NOT nursery leads - they are kept but tagged is_agency=1
# and left off the call list.
