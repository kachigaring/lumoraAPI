# If the employer name contains any of these words, treat it as an agency /
# training provider rather than a nursery (case-insensitive substring).
agency_name_contains:
  - recruit
  - staffing
  - " staff"
  - personnel
  - "education ltd"
  - "education limited"
  - "training ltd"
  - "training limited"
  - "training services"
  - "training provider"
  - apprenticeships
  - "learning ltd"
  - wmc training
  - inspiro
  - "consultancy"
  - "resourcing"
  - "council"
  - "university of"
  - "county council"

scoring:
  weights:
    live_vacancy_7d: 40
    multiple_vacancies: 15       # 2 or more
    senior_role: 10
    large_setting: 15
    not_contacted_60d: 10
    stale_inspection: 5          # last Ofsted inspection > 4 years ago
  large_setting_places: 40
  senior_role_keywords:
    - level 3
    - room leader
    - deputy
    - manager
    - senco
  top_n: 120

# How confident the name match must be to attach Ofsted details to a lead (0-100)
ofsted_enrich:
  name_score_min: 88

output:
  dir: output
